name: Verify offers and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Sun-Fri 13:17 UTC. Saturday 13:17 UTC is inside the window; Sunday 13:17
    # is after 05:30 UTC so it stays. LS-126.
    - cron: '17 13 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  shabbat-guard:
    uses: ./.github/workflows/shabbat-guard.yml

  build:
    needs: shabbat-guard
    if: needs.shabbat-guard.outputs.proceed == 'true'
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         (github.event.pull_request.head.repo.full_name != github.repository ||
          github.event.pull_request.user.login == 'dependabot[bot]')) &&
        'ubuntu-latest' ||
        fromJSON(vars.RUNNER_FLEET_LABELS || '["ubuntu-latest"]')
      }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recheck official offer sources
        if: github.event_name != 'push'
        run: npm run refresh

      - name: Save refreshed offer state
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/offers.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh offer verification"
            git push
          fi

      - name: Test
        run: npm test

      - name: Build GitHub Pages artifact
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
