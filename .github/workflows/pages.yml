              result=true
            fi
          fi

          echo "proceed=${result}"
          if [[ -n "${GITHUB_OUTPUT:-}" ]]; then
            echo "proceed=${result}" >> "${GITHUB_OUTPUT}"
          fi
          exit 0
          # END SHABBAT_GUARD
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.recheck.outputs.proceed == 'true'
        uses: actions/deploy-pages@v4
